# Asset inventory for Purple - Telemetry Gap.
#
# The rule's most severe case is a host that has sent NO Windows event log in
# the lookback at all. Without an inventory that case is indistinguishable from
# "this is not a Windows host", and the rule fired on this lab's two Linux VMs
# every time either of them had ingested within the last 10 minutes: neither can
# ever produce a WinEventLog source, so both sat permanently in the branch the
# rule scores highest. Replace this file with a lookup against your own CMDB or
# asset inventory; the point is that the lookup exists, not that it is a CSV.
[windows_hosts]
filename = windows_hosts.csv
# Hostnames are case-insensitive on Windows but Splunk lookups are case-sensitive by
# default, so a forwarder that reports "hydra-dc" would miss "HYDRA-DC" in the CSV and drop
# out of the Telemetry Gap no-Windows-log branch without any error.
case_sensitive_match = false
