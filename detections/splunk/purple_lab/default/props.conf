# Field extraction is provided by the TAs (Splunk_TA_microsoft_sysmon /
# Splunk_TA_windows) - not here.
#
# This stanza exists for the timestamp drift documented in lab_issues.md #10
# (VM pause/resume desync). Read the two notes below before deploying it; both were
# found by checking the app against the lab rather than by reading it.
#
# NOTE 1 - the stanza key. This was previously written as
#   [WinEventLog:Microsoft-Windows-Sysmon/Operational]
# which is a SOURCETYPE stanza, and it never matched a single event in this lab. The
# forwarder here ships every Windows channel as a bare `WinEventLog` sourcetype and puts
# the channel name only in `source`:
#   sourcetype = WinEventLog
#   source     = WinEventLog:Microsoft-Windows-Sysmon/Operational
# That is the same forwarder defect that leaves Network_Traffic.All_Traffic empty (see
# ../../../README.md), and it is why all the raw searches in savedsearches.conf filter on
# `source=` rather than `sourcetype=`. Keyed on `source::` the stanza applies. Once the
# forwarder is fixed to emit per-channel sourcetypes (scoped into v4), this should go back
# to being a sourcetype stanza.
#
# NOTE 2 - what DATETIME_CONFIG = CURRENT actually does. It stamps each event with the
# time Splunk indexed it, NOT the time in the event. That is deliberate here: when a
# suspended VM resumes, its clock is behind and the events it then forwards carry
# timestamps in the past, which puts them outside the alert windows and out of order on the
# timeline. Using index time keeps the lab's timeline usable.
#
# It is a lab workaround and it has a real cost: true event time is lost, so sub-second
# ordering within a burst and any latency measurement are gone. Do not ship this to
# production - fix the clock (w32tm against the DC) instead. The previous comment on this
# stanza claimed it made events "index at event time, not ingest time", which is backwards.

[source::WinEventLog:Microsoft-Windows-Sysmon/Operational]
DATETIME_CONFIG = CURRENT
TRUNCATE = 0
