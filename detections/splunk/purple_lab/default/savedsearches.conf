# --- NETWORK (Zeek) - added after the v3 run, see v3/README.md -----------------
#
# These two ran in the v3 lab as ad hoc searches and were never shipped, which is why the
# screenshot of six enabled alerts did not match this file. They are here now.
#
# Both parse the raw Zeek TSV with rex, which is what this lab's forwarder delivers. Field
# positions are fixed by Zeek's default log format: in conn.log and ssl.log alike,
# id.orig_h is column 3 and id.resp_h is column 5. v4 moves Zeek to JSON through the Splunk
# Add-on for Zeek, at which point these become field lookups and the rex goes away.

[Purple - Sliver C2 Beacon by JA4 Fingerprint]
search = source="*ssl.log*" NOT _raw="#*" "t13i131000_f57a46bbacb6_e5728521abd4" \
  | rex field=_raw "^(?P<ts>\S+)\t\S+\t(?P<orig_h>\S+)\t\S+\t(?P<resp_h>\S+)" \
  | sort 0 _time \
  | streamstats current=f last(_time) as prev by orig_h \
  | eval gap=_time-prev \
  | stats count avg(gap) as avg_interval stdev(gap) as jitter \
        min(_time) as firstTime max(_time) as lastTime by orig_h resp_h \
  | where count > 5 \
  | eval firstTime=strftime(firstTime,"%F %T"), lastTime=strftime(lastTime,"%F %T"), \
        avg_interval=round(avg_interval,1), jitter=round(jitter,1)
description = T1071.001 - Sliver C2 identified by its JA4 TLS client fingerprint. JA4 hashes the ClientHello, so it survives a rename or recompile: it names the C2 framework, not the file. In the v3 run this returned 69 sessions from SPIDERMAN and 27 from THEPUNISHER to 192.168.182.133, one fingerprint linking two compromises that share no filename or hash. PREREQUISITE: ja4 is not a base Zeek field - it comes from the FoxIO package (zkg install zeek/foxio/ja4). Without it ssl.log has no such column and this search matches nothing. Treat the literal fingerprint as a starting IOC and the interval/jitter columns as the durable signal; a beacon has a low jitter-to-interval ratio, a human browsing does not. The vendor-agnostic version is Sigma rule 13 in detections/sigma/v3_ndr.yml.
dispatch.earliest_time = -24h@h
cron_schedule = */10 * * * *
enableSched = 1
alert.severity = 5

[Purple - Large Outbound Transfer (possible exfiltration)]
search = source="*conn.log*" NOT _raw="#*" \
  | rex field=_raw "^(?P<ts>\S+)\t\S+\t(?P<orig_h>\S+)\t(?P<orig_p>\S+)\t(?P<resp_h>\S+)\t(?P<resp_p>\S+)\t(?P<proto>\S+)\t(?P<service>\S+)\t(?P<duration>\S+)\t(?P<orig_bytes>\S+)\t(?P<resp_bytes>\S+)" \
  | where orig_h!="-" AND match(orig_h,"^192\.168\.182\.") AND NOT match(resp_h,"^192\.168\.182\.13[57]$") \
  | eval orig_bytes=if(orig_bytes="-",0,tonumber(orig_bytes)) \
  | bucket _time span=10m \
  | stats sum(orig_bytes) as bytes_out dc(resp_h) as dests values(resp_p) as ports by _time orig_h \
  | where bytes_out > 10000000 \
  | eval mb_out=round(bytes_out/1024/1024,1) \
  | table _time orig_h mb_out dests ports
description = T1041 - volume-based exfiltration check: bytes sent OUT by an internal host, bucketed in 10-minute windows. Keyed on direction and volume rather than on destination, so it does not depend on knowing the C2 address in advance. THRESHOLD IS A PLACEHOLDER: 10 MB per 10 minutes was never calibrated against this estate's normal egress, so expect false positives from Windows Update, OneDrive and browser traffic until you measure a real baseline and raise it. Pair with the JA4 search above - volume says something left, the fingerprint says what carried it. This is the search that was running in the v3 lab as an ad hoc query and is the reason the enabled-alerts screenshot showed six alerts this app did not carry.
dispatch.earliest_time = -24h@h
cron_schedule = */15 * * * *
enableSched = 0
alert.severity = 3

# --- PIPELINE HEALTH ----------------------------------------------------------
#
# The only rule here that watches the collection path instead of the attacker. Written after
# a real failure in this lab: see config/README.md.

[Purple - Telemetry Gap (Windows logs stale, host still reporting)]
search = | tstats max(_indextime) as last where index=main by host, source \
  | eval kind=if(match(source,"^WinEventLog:"),"win","other") \
  | stats max(last) as last by host kind \
  | chart max(last) over host by kind \
  | lookup windows_hosts host OUTPUT is_windows \
  | eval other_age_min=round((now()-other)/60,0), \
        win_age_min=if(isnull(win),-1,round((now()-win)/60,0)) \
  | where isnotnull(other) AND other_age_min < 10 \
        AND (win_age_min > 20 OR (win_age_min=-1 AND is_windows="true")) \
  | eval severity_rank=if(win_age_min=-1,999999,win_age_min), \
        windows_gap=if(win_age_min=-1,"no Windows log in lookback",tostring(win_age_min)." min"), \
        last_windows_ingest=if(win_age_min=-1,"none",strftime(win,"%F %T")), \
        last_any_ingest=strftime(other,"%F %T") \
  | sort - severity_rank \
  | table host windows_gap other_age_min last_windows_ingest last_any_ingest
description = PIPELINE HEALTH, not a threat detection. Fires when a host is still delivering data but has delivered no Windows event log for over 20 minutes. Written after this exact failure on THEPUNISHER, and then corrected twice on 29 Oct 2026 by running it, which the repo had until then said was not an option because the search had never had a chance to run. Running it found two defects that modelling had not. THE FIELD. This measured max(_time), the newest event timestamp. For pipeline health the question is not how old the newest event is but when the host last DELIVERED anything, which is _indextime. The difference is not cosmetic. Reconstructing the original incident from _indextime: THEPUNISHER delivered its last Security event at 00:17:55, nothing arrived for 67 minutes 22 seconds, and at 01:25:17 roughly 2,270 events landed at once with delivery lags of up to 61 minutes. That is a forwarder restart backfilling from its checkpoint, and the backfilled events carry their ORIGINAL timestamps - so in _time the gap closes retroactively and leaves nothing behind. The _time version fires correctly while an outage is happening and then becomes unverifiable the moment it is fixed; it also cannot tell a wedged input from a quiet host. The _indextime version was run against the same window and returns THEPUNISHER at a 62-minute gap. THE LOOKUP. The most severe case here is a host with NO Windows log in the lookback, scored above every measurable gap. Without an asset inventory that case cannot be told apart from "this is not a Windows host", and it was not: this lab's two Linux VMs have never produced a WinEventLog source (security-vm, 1,219 non-Windows sources and zero Windows; wazuh-vm, 1 and zero), so both sat permanently in the branch the rule scores highest and alerted whenever either had ingested in the previous 10 minutes. Gating that branch on windows_hosts.csv removes both and keeps the real one. Point the lookup at your own inventory. OPERATIONAL. Tune the 20-minute threshold to the quietest legitimate period in your estate. The rule needs a non-WinEventLog feed per host to compare against, and what that is varies even inside this lab: THEPUNISHER sends Perfmon, HYDRA-DC and SPIDERMAN send only C:\Windows\Temp file inputs. On a forwarder shipping Windows logs alone there is nothing to compare against and a dead host and a dead input look identical. tstats reads index metadata rather than raw events, so the 7-day lookback costs about the same as a 4-hour one.
dispatch.earliest_time = -7d
cron_schedule = */15 * * * *
enableSched = 1
alert.severity = 4
