## Purple Team Home Lab — Splunk Detections (Detection-as-Code)
## INSTALL: copy this whole purple_lab/ folder to $SPLUNK_HOME/etc/apps/ and restart.
##
## PREREQS (see ../../README.md):
##   - Splunk Add-on for Microsoft Windows (Splunk_TA_windows)      -> Account_Name, Service_Name,
##     Ticket_Encryption_Type, Client_Address, Process_Command_Line, New_Process_Name ...
##   - Splunk Add-on for Sysmon (Splunk_TA_microsoft_sysmon)        -> Image, DestinationIp, GrantedAccess ...
##   - Splunk Common Information Model (Splunk_SA_CIM)              -> required by the two tstats headliners
##
## Macro-free on purpose. The tstats headliners depend only on the CIM data models;
## summariesonly=false makes them work BEFORE acceleration finishes (slower), then
## accelerate transparently once summaries exist. No rex on raw Message anywhere.

# --- HEADLINERS via CIM data models (accelerate Endpoint + Network_Traffic) ---

[Purple - LOLBin Execution (CIM tstats)]
search = | tstats summariesonly=false allow_old_summaries=true count min(_time) as firstTime max(_time) as lastTime \
    from datamodel=Endpoint.Processes \
    where Processes.process_name IN ("installutil.exe","msbuild.exe","regsvr32.exe","mshta.exe","regasm.exe","regsvcs.exe") \
        AND (Processes.process="*\\Temp\\*" OR Processes.process="*\\AppData\\*" OR Processes.process="*\\ProgramData\\*") \
    by Processes.dest Processes.parent_process_name Processes.process_name Processes.process Processes.user \
  | rename "Processes.*" AS * \
  | eval firstTime=strftime(firstTime,"%F %T"), lastTime=strftime(lastTime,"%F %T")
description = T1218.004 - signed LOLBin executing a payload from a user-writable path.
dispatch.earliest_time = -24h@h
cron_schedule = */15 * * * *
enableSched = 1
alert.severity = 4

[Purple - C2 Beacon from User-Writable Path (CIM tstats)]
search = | tstats summariesonly=false allow_old_summaries=true count values(All_Traffic.dest_port) as dest_ports \
    from datamodel=Network_Traffic.All_Traffic \
    where (All_Traffic.app="*\\Temp\\*" OR All_Traffic.app="*\\AppData\\*" OR All_Traffic.app="*\\ProgramData\\*" OR All_Traffic.app="*\\Users\\Public\\*") \
    by All_Traffic.src All_Traffic.dest All_Traffic.dest_port All_Traffic.app _time span=1m \
  | rename "All_Traffic.*" AS * \
  | stats count dc(_time) as beacons earliest(_time) as firstTime latest(_time) as lastTime by src dest dest_port app \
  | where beacons > 5
description = T1071.001 - behavioral C2. Keyed on process LOCATION + egress, never on the file name (a renamed implant still trips this). CANNOT RETURN RESULTS IN THIS LAB: Network_Traffic.All_Traffic holds 0 events because the forwarder ships every Windows channel as a bare WinEventLog sourcetype, and the Sysmon add-on keys its CIM mappings on the per-channel sourcetype. The 444 EID 3 events in seven days reach the index with no app/src/dest fields and nothing tags them into the model. Left unscheduled until the forwarder is fixed; the equivalent raw-sourcetype query is in v2/03_detection_playbook.md. See detections/README.md.
dispatch.earliest_time = -24h@h
cron_schedule = */10 * * * *
enableSched = 0
alert.severity = 5

# --- RAW sourcetype searches - TA-extracted fields (no rex) -------------------

[Purple - Kerberoasting RC4 Service Ticket]
search = source="WinEventLog:Security" EventCode=4769 Ticket_Encryption_Type="0x17" \
    Service_Name!="krbtgt*" Service_Name!="*$" \
  | stats count min(_time) as firstTime max(_time) as lastTime values(Service_Name) as services \
        by Client_Address Account_Name Ticket_Encryption_Type \
  | eval firstTime=strftime(firstTime,"%F %T"), lastTime=strftime(lastTime,"%F %T")
description = T1558.003 - RC4 (0x17) TGS for a user SPN on an AES domain = Kerberoasting. HAS NEVER ALERTED IN THIS LAB: measured over 30 days of 4769 traffic, 1,649 tickets, all 0x12 (AES-256), not one 0x17. It is scheduled and it reports as coverage - the same failure mode as the Wazuh rule documented in v3/README.md, found the same way, by checking instead of assuming. Note what this does NOT mean: RC4 is not blocked here. The service account still holds an RC4 key and the KDC issues one on request - the Pass-the-Ticket step of the v3 run got a 4768 TGT for that same account at 0x17. The roast came back AES only because GetUserSPNs requested no particular etype and the KDC picked the strongest shared one. So keep this rule: it catches the explicit downgrade (Rubeus /rc4opsec, etype-restricted TGS-REQ), which this domain would still honour. It just cannot see a default-etype roast, which is what a modern toolchain produces. The etype-agnostic companion below covers that case.
dispatch.earliest_time = -24h@h
cron_schedule = */10 * * * *
enableSched = 1
alert.severity = 4

[Purple - Kerberoasting User-SPN Ticket (etype-agnostic)]
search = source="WinEventLog:Security" EventCode=4769 \
    Service_Name!="krbtgt*" Service_Name!="*$" Account_Name!="*$" Account_Name!="*$@*" \
  | stats count min(_time) as firstTime max(_time) as lastTime values(Ticket_Encryption_Type) as etypes \
        by Client_Address Account_Name Service_Name \
  | eval firstTime=strftime(firstTime,"%F %T"), lastTime=strftime(lastTime,"%F %T")
description = T1558.003 - service ticket for an SPN held by a user account, any encryption type. Machine requestors are excluded by BOTH Account_Name!="*$" and Account_Name!="*$@*": on 4769 the requesting account arrives as principal@REALM (this lab's screenshot 03 shows pparker@MARVEL.LOCAL), so a machine account reads THEPUNISHER$@MARVEL.LOCAL and the bare suffix test never matched it. Service_Name keeps the bare "*$" test because the SPN arrives unqualified (SQLService). Same wire-format trap as the Zeek rule in v3_ndr.yml, one field over. Catches the AES (0x12) roast the RC4 rule above misses, which is what the v3 run actually produced. Noisier by design: it fires on legitimate service-ticket traffic too, so build a per-environment allowlist of routinely requested SPNs and alert on the rest. Left unscheduled until that allowlist exists.
dispatch.earliest_time = -24h@h
enableSched = 0
alert.severity = 3

[Purple - Password Spray (multi-user from one source)]
search = source="WinEventLog:Security" EventCode=4771 (Failure_Code="0x18" OR Failure_Code="0xE") \
  | bucket _time span=5m \
  | stats dc(Account_Name) as unique_users count values(Account_Name) as targets by _time Client_Address \
  | where unique_users >= 5
description = T1110.003 - one source, many accounts, one bad attempt each. Correlate on Client_Address, not per-account counts. The filter matches 0x18 (bad password) AND 0xE (etype not supported): both are spray attempts. With 0x18 alone this rule did not fire on its own documented attack - of the 7 accounts the v3 spray hit, 4 produce an 0x18 4771, jsmith is an unknown principal and produces none, pparker succeeded, and Guest fails with 0xE. That is 4 against a threshold of 5. Including 0xE restores the 5th and it fires; the lab screenshot that reported "5 accounts" used no Failure_Code filter at all, which is how the gap stayed hidden. Verified live 29 Oct 2026 by running both versions over the 20 Oct window: the shipped filter returns one row (5 accounts, 9 events, 192.168.182.133, 11:30 bucket) and 0x18 alone returns nothing at any bucket size, because only 4 accounts ever produce one. That run also measured 2 failures per account rather than the 1 a textbook spray implies - still under the 5-failure lockout, and it does not change the rule, which counts distinct accounts rather than attempts. Threshold is 5: the teaching query in v2/03_detection_playbook.md uses 3 so it fires on the smaller v2 run (3 accounts), which is too low for a real estate. The v3 spray hit 7 accounts in 0.6s and fires comfortably. Raise it further in a noisy environment; the v3 case file notes that an unknown-principal attempt produces no 4771 at all, so the true account count is always at or above what this reports.
dispatch.earliest_time = -24h@h
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 3

[Purple - Spray Success (4771 then 4768 same source)]
search = source="WinEventLog:Security" (EventCode=4771 OR EventCode=4768) \
  | eval src=replace(Client_Address,"^::ffff:","") \
  | transaction src maxspan=10m \
  | search eventcount>5 EventCode=4768 EventCode=4771 \
  | table _time src Account_Name eventcount
description = Failed spray immediately followed by a TGT issuance from the same source = compromised account. P1. Both the eval and the second EventCode on the search line were corrected on 29 Oct 2026 by running this query over the 20 Oct data. The version shipped before that was reasoned about rather than executed, and both claims it made were wrong. THE EVAL: this DC does not write Client_Address consistently, and not per event code either. All 9 of the 4771 failures from the spray source carry a bare IPv4 (192.168.182.133). The two TGTs issued to pparker from that same host carry one form each - one bare, one IPv4-mapped (::ffff:192.168.182.133). The note here used to say the raw field split the failures from the success so the rule could never fire. It fires: raw grouping returns the same host at eventcount=10 against the normalised 11, because it catches the one bare 4768. That is a worse finding than a dead rule, not a smaller one - the rule was passing on a coin flip, and had the KDC written both TGTs mapped it would have held 9 failures with no success and stayed silent. Normalising removes the coincidence rather than rescuing a corpse. THE SECOND EVENTCODE: eventcount>5 with EventCode=4768 alone asks for more than 5 events of which at least one is a success, and requires no failure at all. Over 20 Oct that returned 5 groups, 4 of them ::1 - the DC's own loopback Kerberos, 16 to 19 events each, not a spray among them. Requiring both codes returns exactly one group, the real one. Measured on a quiet day: 1 true positive and 4 false before, 1 and 0 after. Check the form your own DC emits before trusting any cross-event-code correlation on an address field, and check that the grouping condition actually requires both sides of the correlation.
dispatch.earliest_time = -24h@h
cron_schedule = */10 * * * *
enableSched = 1
alert.severity = 5

[Purple - SAM Hive Dump via reg save]
search = source="WinEventLog:Security" EventCode=4688 New_Process_Name="*\\reg.exe" \
    Process_Command_Line="*save*" \
    (Process_Command_Line="*SAM*" OR Process_Command_Line="*SYSTEM*" OR Process_Command_Line="*SECURITY*") \
  | table _time host Creator_Process_Name Process_Command_Line
description = T1003.002 - reg.exe save of credential hives. Alert on SAM+SYSTEM+SECURITY combo for low FP.
dispatch.earliest_time = -24h@h
cron_schedule = */10 * * * *
enableSched = 1
alert.severity = 4

[Purple - DCSync from non-DC]
search = source="WinEventLog:Security" EventCode=4662 \
    (Properties="*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*" OR Properties="*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*" OR Properties="*89e95b76-444d-4c62-991a-0facbeda640c*") \
    Account_Name!="*$" Account_Name!="MSOL_*" \
  | table _time host Account_Name Properties
description = T1003.006 - replication rights requested by a user account. High-fidelity, always investigate. Matches all three replication control-access GUIDs (Get-Changes, Get-Changes-All, Get-Changes-In-Filtered-Set), which brings it in line with Sigma rule 5 - the third was in the Sigma rule but missing here. Get-Changes-In-Filtered-Set on its own is also used by legitimate RODC replication, so add known RODCs to the allowlist alongside MSOL_ in an estate that has them.
dispatch.earliest_time = -24h@h
cron_schedule = */10 * * * *
enableSched = 1
alert.severity = 5

[Purple - Scheduled Task Persistence (SYSTEM + user path)]
search = source="WinEventLog:Security" EventCode=4698 Account_Name!="*$" \
  | rex "<Command>(?<task_command>[^<]+)</Command>" \
  | rex "<Arguments>(?<task_args>[^<]+)</Arguments>" \
  | rex "<UserId>(?<task_runas>[^<]+)</UserId>" \
  | eval runas_system=if(task_runas=="S-1-5-18" OR upper(task_runas)=="SYSTEM" OR upper(task_runas)=="NT AUTHORITY\\SYSTEM",1,0) \
  | where like(task_command,"%\\Temp\\%") OR like(task_command,"%\\AppData\\%") OR runas_system=1 \
        OR match(task_args,"(?i)IEX|Invoke-Expression|DownloadString|DownloadFile|Net\.WebClient|FromBase64String|-e(nc|ncodedcommand)\b") \
  | table _time host Account_Name Task_Name task_command task_args task_runas
description = T1053.005 - the rex calls parse the task XML embedded INSIDE the 4698 body (not the Message wrapper). Non-system author + SYSTEM runas, a user-writable command path, or a download cradle in the arguments. The Arguments branch is there because <Command> alone is not enough: the v3 \Updater task has <Command>powershell.exe</Command> with the whole cradle in <Arguments> (screenshot 08), so the path tests both miss and it was caught only by the SYSTEM-runas branch - the same task created in a user context would have gone through. Token list is deliberately narrower than the Wazuh side: it matches cradle tokens only (IEX, DownloadString, Net.WebClient, FromBase64String, -enc) and NOT launcher style (-nop, -w hidden, -ExecutionPolicy Bypass), which are common in legitimate scheduled tasks and which Wazuh scores separately at level 10 via rule 100211. The cost is that Splunk is less sensitive than Wazuh on launcher-only tasks; the benefit is that it does not fire on routine administrative ones. A 4698 with no <Arguments> leaves task_args null and that branch false. Verified against a real 4698 in this index: Splunk receives the task XML unescaped, so the literal angle brackets match. Wazuh receives the same field HTML-escaped (&lt;Command&gt;), which is why the Wazuh rules key on command tokens rather than on XML structure - the same pattern is not portable between the two. VERIFIED LIVE 29 Oct 2026 by trigger, and the SYSTEM branch was broken when it was. Three tasks were registered on HYDRA-DC: one with a cradle in <Arguments> running as a named user from a System32 command path, one benign in every respect, and one benign running as SYSTEM. Only the first fired, which isolates the Arguments branch because the other three conditions could not have matched it, and the benign control stayed silent. The third task exposed the defect. Windows does not write <UserId> in one form: the v3 \Updater task carries S-1-5-18, a task registered with Register-ScheduledTask -User SYSTEM carries the literal string SYSTEM, and named principals carry MARVEL\Administrator or SPIDERMAN\peterparker. Equality against S-1-5-18 alone therefore missed a task that runs as SYSTEM and was created through PowerShell, which is an ordinary way to create one. Normalising the three SYSTEM forms fixes it and costs nothing measurable: over the whole of 20 Oct the rule returns one row, the real \Updater, and nothing else. Note what carries that precision - the benign S-1-5-18 tasks that day (Windows Defender Scheduled Scan three times, MRT once) are excluded by Account_Name!="*$", not by anything in the where clause, so the machine-account filter is load-bearing rather than hygiene. KNOWN EVASION, LEFT OPEN ON PURPOSE. The path branches test for a literal \Temp\ and \AppData\, so an unexpanded environment variable walks past both: a task whose command is %APPDATA%\evil.exe matches neither. Adding a branch for %localappdata%|%appdata%|%temp%|%userprofile% was measured rather than assumed, and rejected. Over the same day it adds two false positives (OneDrive Standalone Update Task, which stores its command unexpanded) and no true ones, taking the rule from 1 of 1 to 1 of 3. The evasion needs an attacker who knows to reach for it; the noise arrives by itself.
dispatch.earliest_time = -24h@h
cron_schedule = */10 * * * *
enableSched = 1
alert.severity = 4

[Purple - LSASS Access (credential theft mask)]
search = source="WinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=10 \
    TargetImage="*\\lsass.exe" \
    GrantedAccess IN ("0x1438","0x143a","0x1f0fff","0x1f1fff","0x1f2fff","0x1f3fff","0x1fffff") \
    SourceImage!="C:\\Windows\\System32\\svchost.exe" \
    SourceImage!="C:\\Windows\\System32\\wininit.exe" \
    SourceImage!="C:\\Windows\\System32\\csrss.exe" \
    SourceImage!="C:\\Windows\\System32\\taskmgr.exe" \
    SourceImage!="C:\\Windows\\System32\\MRT.exe" \
    SourceImage!="C:\\Windows\\System32\\wbem\\WmiPrvSE.exe" \
    SourceImage!="C:\\ProgramData\\Microsoft\\Windows Defender\\Platform\\*\\MsMpEng.exe" \
    SourceImage!="C:\\Program Files\\VMware\\VMware Tools\\vmtoolsd.exe" \
    SourceImage!="C:\\Program Files (x86)\\ossec-agent\\wazuh-agent.exe" \
  | table _time host SourceImage TargetImage GrantedAccess
description = T1003.001 - handle to lsass with a dump-capable access mask. Mask list and exclusions are measured, not guessed: against 935 real EID 10 reads of lsass.exe sampled from THEPUNISHER, an earlier version of this rule that also matched 0x1010 and 0x1410 would have fired 90 times with 89 of them benign (79 from WmiPrvSE.exe alone, and wazuh-agent.exe reads LSASS at 0x1fffff). It also omitted 0x1f3fff, the mask SharpKatz actually used in the v3 run, so it missed the one event that mattered. Note the exclusions anchor the FULL path rather than matching on filename: "*\\svchost.exe" would also suppress C:\\Temp\\svchost.exe, which is exactly how a masquerading implant would hide from this rule. Anchored this way, a fake svchost in a user-writable path still alerts - verified against the Wazuh version of the same list. Mask list and exclusion set are identical across the Sigma rule, this search and detections/wazuh/local_rules.xml. See v3/README.md for the measurement.
dispatch.earliest_time = -24h@h
cron_schedule = */10 * * * *
enableSched = 1
alert.severity = 4

[Purple - Kerbrute User Enumeration (4768 error 0x6)]
search = source="WinEventLog:Security" EventCode=4768 Result_Code="0x6" \
  | bucket _time span=1m \
  | stats count dc(Account_Name) as unique_users by _time Client_Address \
  | where count > 50 AND unique_users > 20
description = T1087.002 - burst of KDC_ERR_C_PRINCIPAL_UNKNOWN from one source = kerbrute userenum. Both conditions matter: a single mistyped service account can produce a high count against one name, so the distinct-name count is what separates enumeration from a broken client.
dispatch.earliest_time = -24h@h
cron_schedule = */10 * * * *
enableSched = 1
alert.severity = 2

