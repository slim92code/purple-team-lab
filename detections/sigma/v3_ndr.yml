title: WinRM Lateral Movement — East-West 5985
id: a7d41e92-0b53-4c86-8e1f-2f9b6c3d7a08
status: experimental
description: >
    Detects a completed connection to WinRM (TCP 5985) sourced from another workstation
    in the estate. Administrative WinRM normally originates from a management/jump host;
    workstation-to-workstation WinRM is the lateral-movement pattern the v3 chain used
    (SPIDERMAN -> THEPUNISHER) after the host-firewall mesh blocked SMB east-west.
references:
    - https://attack.mitre.org/techniques/T1021/006/
author: Purple Lab (MARVEL.LOCAL)
date: 2026/10/23
tags:
    - attack.lateral-movement
    - attack.t1021.006
logsource:
    product: zeek
    service: conn
detection:
    selection:
        id.resp_p: 5985
        conn_state:
            - 'SF'
            - 'S1'
            - 'OTH'
    filter_approved_source:
        # Replace with the real management and configuration-management hosts.
        # Zeek conn.log does not know which address is a jump host, so without this
        # list the rule matches every WinRM session, not only east-west ones.
        id.orig_h:
            - '192.168.182.1'
    condition: selection and not filter_approved_source
fields:
    - id.orig_h
    - id.resp_h
    - id.resp_p
falsepositives:
    - >-
      Any WinRM session whose source is not in filter_approved_source. The east-west
      qualifier in the title comes from that list and nothing else, so an empty or
      unmaintained list turns this into an alert on all WinRM. In this lab there is no
      jump host, which is why the v3 pivot from SPIDERMAN to THEPUNISHER stands out.
    - Configuration-management tooling (DSC, Ansible winrm) from a controller not listed
level: medium

