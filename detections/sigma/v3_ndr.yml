title: Sliver C2 Beacon — JA4 TLS Client Fingerprint
id: c0e9b7a4-5d12-4f3a-b6c8-9a0e1f2d3b45
status: experimental
description: >
    Detects the Sliver C2 TLS client by its JA4 fingerprint in ssl.log. JA4 hashes the
    TLS ClientHello (the implant's TLS stack), so it survives a binary rename or
    recompile — it identifies the C2 framework, not a filename or payload hash. Treat
    the literal fingerprint as a starting IOC; the durable detection is "this JA4
    beaconing on an interval to an external host."
references:
    - https://attack.mitre.org/techniques/T1071/001/
    - https://github.com/FoxIO-LLC/ja4
author: Purple Lab (MARVEL.LOCAL)
date: 2026/10/23
tags:
    - attack.command-and-control
    - attack.t1071.001
logsource:
    product: zeek
    service: ssl
detection:
    selection:
        ja4: 't13i131000_f57a46bbacb6_e5728521abd4'
    condition: selection
fields:
    - id.orig_h
    - id.resp_h
    - ja4
falsepositives:
    - A benign client that happens to share this exact TLS stack fingerprint (rare;
      confirm with beacon interval/jitter analysis before escalating)
level: high
