# Purple Team Home Lab — Sigma Detection Pack, v3 NDR additions
# Network-side detections (Zeek) added in lab v3, alongside the v2 host rules in
# sigma_rules.yml. Compile with the Zeek pipeline:
#   pip install sigma-cli pysigma-backend-splunk pysigma-pipeline-zeek
#   sigma convert -t splunk -p zeek detections/sigma/v3_ndr.yml
#
# These key on network evidence, so they fire even on a host whose endpoint
# telemetry is blind (see the SPIDERMAN EID10 blind spot in v3).
#
# PREREQUISITE for the JA4 rule: the `ja4` field is NOT part of base Zeek. It comes from
# the FoxIO JA4 package (https://github.com/FoxIO-LLC/ja4), installed with
# `zkg install zeek/foxio/ja4`. Without it ssl.log has no ja4 column and that rule can
# never fire. Base Zeek ships ja3 only via a separate package as well.
#
# The Zeek deployment in this lab is otherwise stock -- default scripts, default logs, no
# local.zeek customisation -- which is why no sensor config ships in this repo. Suricata
# is likewise stock: the Suricata evidence cited in v3 is its built-in protocol logging
# and app-layer anomaly events, not signatures written here.

title: Kerberoasting — Service Ticket for a User SPN (network, etype-agnostic)
id: 3b8f0c21-6a4e-4d9b-9f2a-1c7e5d0a4411
status: experimental
description: >
    Detects a Kerberos service-ticket (TGS) request seen on the wire, excluding krbtgt
    service tickets and requests made BY a machine account. It keys on the SPN pattern
    rather than the ticket encryption type, so it catches AES (0x12) Kerberoasting that an
    RC4-only (0x17) rule misses — the v3 roast used AES. Complements the host-side 4769
    rule. The two filters act on different fields, which the earlier wording blurred:
    filter_krbtgt is service-side (the SPN requested), filter_machine is client-side (the
    principal requesting). It does NOT exclude machine-account services (host/, cifs/ …
    SPNs), so like the host-side etype-agnostic rule it fires on routine user-to-service
    traffic and needs a per-environment SPN allowlist before it is alertable.
references:
    - https://attack.mitre.org/techniques/T1558/003/
author: Purple Lab (MARVEL.LOCAL)
date: 2026/10/23
tags:
    - attack.credential-access
    - attack.t1558.003
logsource:
    product: zeek
    service: kerberos
detection:
    selection:
        request_type: 'TGS'
    filter_krbtgt:
        service|startswith: 'krbtgt'
    filter_machine:
        # 'contains', not 'endswith'. Zeek writes the client as principal/REALM, so a
        # machine account reads THEPUNISHER$/MARVEL.LOCAL and does not end in '$' --
        # confirmed against this lab's own kerberos.log (v3 screenshot 01, where the
        # clients are Administrator/MARVEL.LOCAL, pparker/MARVEL.LOCAL ...). Written as
        # 'endswith' the filter matched nothing and the rule alerted on every machine
        # account's service ticket, which in a real estate is most of the traffic. The
        # host-side 4769 rule can use a suffix test because Windows supplies the bare
        # account name; the same expression is wrong on the wire.
        client|contains: '$'
    condition: selection and not (filter_krbtgt or filter_machine)
fields:
    - id.orig_h
    - client
    - service
falsepositives:
    - A service account legitimately requesting another service's ticket
level: medium

