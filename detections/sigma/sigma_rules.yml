title: LSASS Process Access With Credential-Theft Access Mask
id: 691ee169-5050-4f4a-89be-69eeb0beac1d
status: stable
description: >
    Detects a process opening a handle to lsass.exe with an access mask consistent
    with memory reading (Mimikatz/comsvcs/procdump style credential theft).
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: Purple Lab (MARVEL.LOCAL)
date: 2026/01/15
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess:
            - '0x1438'
            - '0x143a'
            - '0x1f0fff'
            - '0x1f1fff'
            - '0x1f2fff'
            - '0x1f3fff'
            - '0x1fffff'
    filter_platform:
        SourceImage|endswith:
            - '\wininit.exe'
            - '\csrss.exe'
            - '\MsMpEng.exe'
            - '\svchost.exe'
            - '\WmiPrvSE.exe'
            - '\vmtoolsd.exe'
            - '\wazuh-agent.exe'
            - '\taskmgr.exe'
            - '\MRT.exe'
    condition: selection and not filter_platform
fields:
    - SourceImage
    - TargetImage
    - GrantedAccess
falsepositives:
    - >-
      Platform processes reading lsass during normal operation. The exclusion list is
      measured, not assumed. Against 935 real EID 10 reads of lsass.exe sampled from one
      host, a version of this rule that also matched 0x1010 and 0x1410 fired 90 times with
      89 benign, 79 of them from WmiPrvSE.exe alone. Re-measure on your own baseline before
      deploying.
    - >-
      Code injected into one of the excluded signed binaries inherits its SourceImage and is
      suppressed. Separating that needs CallTrace, which this rule does not use.
level: high

