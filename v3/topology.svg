<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="'DejaVu Sans Mono','Consolas',monospace">
  <defs>
    <marker id="atk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#f87171"/>
    </marker>
    <marker id="tel" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#22d3ee"/>
    </marker>
    <marker id="edr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4ade80"/>
    </marker>
    <marker id="net" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#fb923c"/>
    </marker>
    <marker id="lat" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="600" fill="#0d0f14"/>

  <text x="28" y="40" fill="#e8ecf4" font-size="20" font-weight="700">MARVEL.LOCAL — Lab v3 Topology &amp; Detection Flow</text>
  <text x="28" y="62" fill="#7a849e" font-size="12.5">VMware NAT · 192.168.182.0/24 · 5 detection layers</text>

  <!-- ATTACKER -->
  <rect x="28" y="250" width="150" height="86" rx="8" fill="#1c1216" stroke="#f87171" stroke-width="1.5"/>
  <text x="103" y="282" fill="#f87171" font-size="13" font-weight="700" text-anchor="middle">Kali</text>
  <text x="103" y="301" fill="#c8cfe8" font-size="11" text-anchor="middle">Attacker</text>
  <text x="103" y="320" fill="#7a849e" font-size="11" text-anchor="middle">.133</text>

  <!-- AD ESTATE -->
  <text x="300" y="96" fill="#7a849e" font-size="11" font-weight="600" letter-spacing="1">AD ESTATE</text>
  <!-- DC -->
  <rect x="300" y="108" width="210" height="74" rx="8" fill="#141720" stroke="#3d4460" stroke-width="1.2"/>
  <text x="314" y="132" fill="#e8ecf4" font-size="13" font-weight="700">HYDRA-DC · .135</text>
  <text x="314" y="150" fill="#7a849e" font-size="10.5">Win Server 2022 · AD DS</text>
  <text x="314" y="166" fill="#a78bfa" font-size="10">Sysmon · UF · Wazuh</text>
  <!-- SPIDERMAN -->
  <rect x="300" y="226" width="210" height="74" rx="8" fill="#141720" stroke="#3d4460" stroke-width="1.2"/>
  <text x="314" y="250" fill="#e8ecf4" font-size="13" font-weight="700">SPIDERMAN · .138</text>
  <text x="314" y="268" fill="#7a849e" font-size="10.5">Win 10 · initial access</text>
  <text x="314" y="284" fill="#a78bfa" font-size="10">EID10 BLIND · UF · Wazuh</text>
  <!-- THEPUNISHER -->
  <rect x="300" y="344" width="210" height="74" rx="8" fill="#141720" stroke="#3d4460" stroke-width="1.2"/>
  <text x="314" y="368" fill="#e8ecf4" font-size="13" font-weight="700">THEPUNISHER · .137</text>
  <text x="314" y="386" fill="#7a849e" font-size="10.5">Win 10 · pivot target</text>
  <text x="314" y="402" fill="#a78bfa" font-size="10">EID10 on · UF · Wazuh</text>

  <!-- NDR -->
  <text x="610" y="470" fill="#7a849e" font-size="11" font-weight="600" letter-spacing="1">NDR</text>
  <rect x="610" y="482" width="210" height="72" rx="8" fill="#12191c" stroke="#fb923c" stroke-width="1.3"/>
  <text x="624" y="506" fill="#fb923c" font-size="13" font-weight="700">security-vm · .151</text>
  <text x="624" y="524" fill="#7a849e" font-size="10.5">Zeek + Suricata</text>
  <text x="624" y="540" fill="#7a849e" font-size="10.5">JA4 · krb5 · conn/ssl logs</text>

  <!-- SIEM / EDR manager -->
  <rect x="790" y="108" width="162" height="74" rx="8" fill="#12161c" stroke="#4ade80" stroke-width="1.3"/>
  <text x="804" y="132" fill="#4ade80" font-size="13" font-weight="700">Wazuh · .150</text>
  <text x="804" y="150" fill="#7a849e" font-size="10.5">EDR manager</text>
  <text x="804" y="166" fill="#7a849e" font-size="10.5">3 Windows agents</text>

  <rect x="790" y="250" width="162" height="86" rx="8" fill="#101a24" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="871" y="282" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="middle">Splunk SIEM</text>
  <text x="871" y="301" fill="#c8cfe8" font-size="11" text-anchor="middle">.131</text>
  <text x="871" y="320" fill="#7a849e" font-size="10.5" text-anchor="middle">index=main</text>

  <!-- ATTACK arrows: Kali -> DC and SPIDERMAN (direct); THEPUNISHER is reached via the WinRM pivot -->
  <path d="M178,286 C240,220 250,160 298,150" fill="none" stroke="#f87171" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#atk)"/>
  <path d="M178,293 L296,270" fill="none" stroke="#f87171" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#atk)"/>

  <!-- telemetry: estate -> Splunk (host logs via UF) -->
  <path d="M510,145 C650,150 700,250 788,275" fill="none" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#tel)"/>
  <path d="M510,263 L788,285" fill="none" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#tel)"/>
  <path d="M510,381 C650,370 700,320 788,300" fill="none" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#tel)"/>

  <!-- EDR: all three agents -> Wazuh -->
  <path d="M510,126 C640,120 700,135 788,142" fill="none" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#edr)"/>
  <path d="M510,248 C650,220 700,165 788,158" fill="none" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#edr)"/>
  <path d="M510,392 C660,388 710,210 788,174" fill="none" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#edr)"/>

  <!-- Wazuh -> Splunk -->
  <path d="M871,182 L871,248" fill="none" stroke="#4ade80" stroke-width="1.3" marker-end="url(#edr)"/>

  <!-- network mirror: whole segment -> NDR (SPAN, all hosts) -->
  <path d="M512,150 L548,150" fill="none" stroke="#fb923c" stroke-width="1" stroke-dasharray="2 3"/>
  <path d="M512,263 L548,263" fill="none" stroke="#fb923c" stroke-width="1" stroke-dasharray="2 3"/>
  <path d="M512,381 L548,381" fill="none" stroke="#fb923c" stroke-width="1" stroke-dasharray="2 3"/>
  <path d="M548,150 L548,381" fill="none" stroke="#fb923c" stroke-width="1.2"/>
  <text x="556" y="250" fill="#fb923c" font-size="9.5">SPAN</text>
  <text x="556" y="262" fill="#fb923c" font-size="9.5">mirror</text>
  <path d="M548,300 C575,400 585,470 608,500" fill="none" stroke="#fb923c" stroke-width="1.4" stroke-dasharray="2 3" marker-end="url(#net)"/>
  <!-- NDR -> Splunk -->
  <path d="M820,500 C880,440 875,390 872,338" fill="none" stroke="#fb923c" stroke-width="1.4" marker-end="url(#net)"/>

  <!-- SEGMENTATION PANEL -->
  <rect x="28" y="426" width="404" height="92" rx="6" fill="#141720" stroke="#2a2f45"/>
  <text x="44" y="448" fill="#7a849e" font-size="11" font-weight="700" letter-spacing="1">FIREWALL SEGMENTATION · host rules</text>
  <text x="44" y="470" fill="#f87171" font-size="11" font-weight="700">BLOCKED</text>
  <text x="112" y="470" fill="#c8cfe8" font-size="11">Kali → SMB (DC) · WMI (all hosts)</text>
  <text x="44" y="489" fill="#f87171" font-size="11" font-weight="700">BLOCKED</text>
  <text x="112" y="489" fill="#c8cfe8" font-size="11">endpoint ↔ endpoint SMB (east-west)</text>
  <text x="44" y="508" fill="#fbbf24" font-size="11" font-weight="700">OPEN</text>
  <text x="112" y="508" fill="#c8cfe8" font-size="11">WinRM 5985 east-west → the lateral path</text>

  <!-- east-west lateral arrow: SPIDERMAN -> THEPUNISHER (open WinRM) -->
  <path d="M290,300 C262,318 262,326 290,344" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#lat)"/>
  <text x="256" y="325" fill="#fbbf24" font-size="9.5" text-anchor="end">WinRM 5985</text>

  <!-- LEGEND -->
  <g font-size="11">
    <rect x="28" y="520" width="520" height="56" rx="6" fill="#141720" stroke="#2a2f45"/>
    <line x1="44" y1="538" x2="74" y2="538" stroke="#f87171" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#atk)"/>
    <text x="82" y="542" fill="#c8cfe8">attack</text>
    <line x1="150" y1="538" x2="180" y2="538" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#tel)"/>
    <text x="188" y="542" fill="#c8cfe8">host logs → SIEM (UF)</text>
    <line x1="360" y1="538" x2="390" y2="538" stroke="#4ade80" stroke-width="1.3" marker-end="url(#edr)"/>
    <text x="398" y="542" fill="#c8cfe8">Wazuh EDR</text>
    <line x1="44" y1="562" x2="74" y2="562" stroke="#fb923c" stroke-width="1.4" marker-end="url(#net)"/>
    <text x="82" y="566" fill="#c8cfe8">network traffic → Zeek/Suricata → SIEM</text>
  </g>
</svg>
